workflows:
  ios-unsigned-ipa:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen
      - name: Build (no signing)
        script: |
          xcodebuild -project VocalSegments.xcodeproj \
            -scheme VocalSegments \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        script: |
          mkdir -p build/Payload
          cp -r "build/DerivedData/Build/Products/Release-iphoneos/VocalSegments.app" build/Payload/
          cd build && zip -r VocalSegments.ipa Payload
    artifacts:
      - build/VocalSegments.ipa
